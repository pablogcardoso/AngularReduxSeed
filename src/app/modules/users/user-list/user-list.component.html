<div class="flex-row">
    <header class="text-2xl font-bold mb-4">Users</header>
    <section class="mb-4">
    <button
        type="button"
        class="primary-button"
        (click)="openForm()"
    >
        Add User
    </button>
    </section>
    <table class="table-st">
        <thead class="bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
            @for (col of usersColumnsHeader; track $index) {
            <th
                class="px-6 py-4 text-left text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">
                {{col}}</th>
            }
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            @for (user of users; track $index) {
            <tr>
                <td>{{user.id}}</td>
                <td>{{user.name}}</td>
                <td>{{user.email}}</td>
                <td>{{user.roles}}</td>
                <td>{{user.status}}</td>
            </tr>
            }
        </tbody>
    </table>
     @if (showForm) {
        <base-modal title="New User" (closed)="closeForm()">
            <app-user-form (saved)="onSaved()" />
        </base-modal>
    }
</div>
