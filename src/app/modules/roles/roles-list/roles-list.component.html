<div class="w-3xl">
    <header> </header>
    <table class="table-st">
        <thead class="bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700" >
            <tr>
                @for (col of rolesColumnsHeader; track $index) {
                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">{{col}}</th>
                }
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            @for (role of roles; track $index) {
            <tr>
                <td>{{role.id}}</td>
                <td>{{role.name}}</td>
                <td>{{role.permission}}</td>
                <td>{{role.status}}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
