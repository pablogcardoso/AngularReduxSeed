<div class="w-3xl">
    <header class="text-2xl font-bold mb-4">Roles</header>
    <section class="mb-4">
        <button
            type="button"
            class="primary-button"
            (click)="openForm()"
        >
            Add Role
        </button>
    </section>

    <table class="table-st">
        <thead class="bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
            <tr>
                @for (col of rolesColumnsHeader; track $index) {
                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">{{col}}</th>
                }
                <th class="px-6 py-4 text-right text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            @for (role of roles; track $index) {
            <tr>
                <td class="px-6 py-4">{{role.id}}</td>
                <td class="px-6 py-4">{{role.name}}</td>
                <td class="px-6 py-4">{{role.permission}}</td>
                <td class="px-6 py-4">{{role.status}}</td>
                <td class="px-6 py-4">
                    <div class="flex justify-end gap-2">

                        <button
                            type="button"
                            (click)="onRemove(role.id)"
                            class="inline-flex items-center rounded-md border border-transparent bg-red-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500"
                        >
                            Remove
                        </button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>

    @if (showForm) {
        <base-modal title="New Role" (closed)="closeForm()">
            <app-role-form (saved)="onSaved()" />
        </base-modal>
    }
</div>
